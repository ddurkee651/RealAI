plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oblivionburn.nlp'
    compileSdk 34

    defaultConfig {
        applicationId "com.oblivionburn.nlp"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    // AndroidX
    implementation('androidx.appcompat:appcompat:1.6.1') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation('androidx.core:core:1.12.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }

    // Material Components (NavigationView, DrawerLayout)
    implementation 'com.google.android.material:material:1.9.0'

    // Desugaring (needed for java.time, streams, etc. on older APIs)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // PDF text extraction (optional but recommended)
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
